# Netlify config for the Anvil marketing site. Site lives at the repo root; leave Base directory blank.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Deploy previews and branch deploys render scheduled and held posts so they can be reviewed before their date.
[context.deploy-preview.environment]
  ANVIL_PREVIEW = "1"

[context.branch-deploy.environment]
  ANVIL_PREVIEW = "1"

# Long cache for hashed assets, short for HTML.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Tracked /go/ links (attribution by article/CTA). Add one per CTA placement.
# Keep the query string so Close/GA can read the source.
[[redirects]]
  from = "/go/:slug"
  to = "/contact?src=:slug"
  status = 302
  force = true

# Friendly aliases. /docs and /trust are first-party pages, not external hosts.
# No customer login host is published. Send /login to contact instead of a dead app domain.
[[redirects]]
  from = "/login"
  to = "/contact"
  status = 302

# File-format builds also emit *.html. A splat only matches at the end of a path,
# so "/*.html" never catches /platform/rcm.html. scripts/html-redirects.mjs writes
# a forced 301 for each dist HTML file into dist/_redirects.

[[redirects]]
  from = "/blog"
  to = "/resources"
  status = 301

[[redirects]]
  from = "/blog/*"
  to = "/resources/:splat"
  status = 301
